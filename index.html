<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>

<!-- Elegant Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

<style>
/* Color Palette: 
   Mocha Brown: #7A5A4A
   Walnut: #B8845A
   Taupe: #C8B6A6
   Champagne: #E7D1B8
   Nude Blush: #F4E7DD
*/

body {
    margin: 0;
    padding: 0;
    font-family: 'Montserrat', sans-serif;
    background: #F4E7DD;
    color: #7A5A4A;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Luxury Card */
.card {
    width: 95%;
    max-width: 650px;
    margin: 60px auto;
    padding: 35px 25px;
    border-radius: 2px;
    background: linear-gradient(135deg, #FDFBFB 0%, #E7D1B8 100%);
    border: 1px solid #B8845A;
    outline: 4px solid #FDFBFB;
    outline-offset: -18px;
    box-shadow: 0 30px 60px rgba(122, 90, 74, 0.2);
    text-align: center;
    box-sizing: border-box;
    position: relative;
    z-index: 5; /* Card layer */
}

/* Headings */
h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(18px, 4vw, 24px);
    color: #7A5A4A;
    text-transform: uppercase;
    letter-spacing: 6px;
    margin: 0 0 40px;
    font-weight: 300;
}

.names {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(32px, 8vw, 48px);
    color: #B8845A;
    margin: 20px 0;
    line-height: 1.2;
}

.subtitle {
    font-family: 'Playfair Display', serif;
    font-size: clamp(13px, 3vw, 16px);
    color: #7A5A4A;
    font-style: italic;
    letter-spacing: 2px;
    margin: 10px 0;
}

/* ✅ Bouquet Photo */
.photos {
    margin: 20px 0;
}

.photos img {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 50%;
    border: 1px solid #B8845A;
    padding: 8px;
    background: #FFFFFF;
    box-shadow: 0 15px 35px rgba(0,0,0,0.05);
}

/* ✅ Elegant Details with Custom Icons */
.details {
    margin: 20px 0;
    font-family: 'Playfair Display', serif;
    border-top: 1px solid rgba(184, 132, 90, 0.3);
    border-bottom: 1px solid rgba(184, 132, 90, 0.3);
    padding: 20px 0;
}

.detail-item {
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.detail-item:last-child { margin-bottom: 0; }

.icon-svg {
    width: 24px;
    height: 24px;
    fill: #B8845A;
    margin-bottom: 10px;
}

.detail-text {
    font-size: clamp(16px, 4vw, 20px);
    color: #7A5A4A;
}

.location-sub {
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    color: #C8B6A6;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
}

/* ✅ Share Button */
button {
    margin: 25px auto 0;
    display: block;   
    padding: 18px 55px;
    border: 1px solid #7A5A4A;
    background: transparent;
    color: #7A5A4A;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 4px;
    transition: all 0.5s ease;
}

button:hover {
    background: #7A5A4A;
    color: #F4E7DD;
    letter-spacing: 6px;
}

.floating-item {
    position: fixed;
    top: -50px;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    animation: fallDown linear forwards;
}

    .floating-heart {
    width: 16px;
    height: 16px;
    background: #B8845A;
    transform: rotate(45deg);
    box-shadow: 0 4px 8px rgba(0,0,0,.15);
    animation-timing-function: linear;
}
    
    
/* ✅ Floating Elements (Updated for Visibility) */
/*.floating-item {
    position: fixed;
    z-index: 100; /* High Z-index to float IN FRONT of everything */
    /*pointer-events: none;
    opacity: 0;
    animation: floatUp linear infinite;
}*/

/*.floating-heart {
    width: 14px;
    height: 14px;
    background: #B8845A;
    transform: rotate(45deg);
    box-shadow: 1px 1px 5px rgba(0,0,0,0.1);
}*/

.floating-heart::before, .floating-heart::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    background: inherit;
    border-radius: 50%;
}
.floating-heart::before { top: -7px; left: 0; }
.floating-heart::after { left: -7px; top: 0; }

.floating-verse {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: #5D4037; /* Slightly darker brown for better contrast */
    font-size: 14px;
    font-weight: 700; /* Bolder for readability */
    white-space: nowrap;
    letter-spacing: 1px;
    background: rgba(244, 231, 221, 0.4); /* Subtle glow background */
    padding: 5px 10px;
    border-radius: 10px;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
}

@keyframes fallDown {
    0% {
        transform: translateY(-10vh) translateX(0px) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    25% {
        transform: translateY(25vh) translateX(-15px) rotate(10deg);
    }

    50% {
        transform: translateY(50vh) translateX(20px) rotate(-15deg);
    }

    75% {
        transform: translateY(75vh) translateX(-10px) rotate(15deg);
    }

    100% {
        transform: translateY(110vh) translateX(15px) rotate(30deg);
        opacity: 0;
    }
}



/* Bible verse at bottom */
.verse-footer {
    margin-top: 20px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: #B8845A;
    font-size: 14px;
    line-height: 1.8;
    opacity: 0.8;
}

@media (max-width: 480px) {
    .card { padding: 25px 18px; margin: 10px; }
    .names { font-size: 36px; }
}
</style>

</head>

<body>

<div class="card">

    <h1>Wedding Invitation</h1>

    <div class="subtitle">Together with their families,</div>

    <div class="names">
        Nwabisa Dlamini <br> & <br> Sibusiso Hlongwane
    </div>

    <div class="subtitle">invite you to celebrate their wedding</div>

     <audio autoplay loop>
        <source src="Feza-Umaqondana-(JustNaija.com).mp3" type="audio/mpeg">
     </audio>

   
    <!-- Bouquet Photo -->
    <div class="photos">
        <img src="flower.jpeg" alt="Wedding Bouquet">
    </div>

    <div class="details">
        <div class="detail-item">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/></svg>
            <div class="detail-text"><b>8 November 2026</b></div>
        </div>
        
        <div class="detail-item">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            <div class="detail-text"><b>Khaya Family Church</b></div>
            <div class="location-sub">Khumalo Valley, Katlehong</div>
        </div>
    </div>

    <!-- Bible Verse Footer -->
    <div class="verse-footer">
        "Therefore what God has joined together, <br> let no one separate." <br> – Mark 10:9
    </div>

</div>

<script>
function shareWhatsApp() {
    const message = "You're invited to our wedding!\n\nNwabisa Dlamini & Sibusiso Hlogwane\n📅 8 Nov 2026\n📍 Khaya Family Church, Katlehong\n\nJoin us in celebrating our love!";
    const url = "https://wa.me/?text=" + encodeURIComponent(message);
    window.open(url, "_blank");
}

const loveVerses = [
    "Love is patient, love is kind.",
    "Love never fails.",
    "Faith, hope, and love.",
    "I have found the one my heart loves.",
    "Love bears all things.",
    "Let all that you do be done in love.",
    "We love because He first loved us.",
    "Love is the greatest of these.",
    "Two are better than one."
];

function createFloatingElement() {
    const isVerse = Math.random() > 0.82;
    const el = document.createElement("div");
    el.classList.add("floating-item");
    
    if (isVerse) {
        el.classList.add("floating-verse");
        el.innerText = loveVerses[Math.floor(Math.random() * loveVerses.length)];
    } else {
        el.classList.add("floating-heart");
    }

    // Set a random horizontal position
    el.style.left = (Math.random() * 90 + 5) + "vw";
    
    // Slow down the animation for readability
    el.style.animationDuration = (Math.random() * 5 + 6) + "s";

    // Small random delay
    el.style.animationDelay = (Math.random() * 2) + "s";
    
    document.body.appendChild(el);
    
    // Remove after animation completes
    setTimeout(() => { el.remove(); }, 22000);
}

// Start floating animation with a faster interval
setInterval(() => {
    for (let i = 0; i < 3; i++) {
        setTimeout(createFloatingElement, i * 250);
    }
}, 1000);
</script>

</body>
</html>
